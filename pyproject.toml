[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "pavessl"
authors = [{name = "nelioasousa"}]
description = "Pre-training vision models using SSL"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["dependencies"]

[project.optional-dependencies]
cpu = ["torch", "torchvision"]
dev = ["ruff"]

[project.urls]
Source = "https://github.com/nelioasousa/PaveSSL"

[project.scripts]
# Dataset handling
data-overview = "pavessl.scripts.rdd2022.overview:_run"
prepare-data = "pavessl.scripts.rdd2022.prepare:_run"
# Pre-training
ssl-pretrain = "pavessl.scripts.pretrain.ssl_pretrain:_run"
sup-pretrain = "pavessl.scripts.pretrain.sup_pretrain:_run"
# Evaluations
knn-eval = "pavessl.scripts.eval.knn_eval:_run"
linear-eval = "pavessl.scripts.eval.linear_eval:_run"
# Utilities
plot-results = "pavessl.scripts.utils.plot_results:_run"
augmentations = "pavessl.scripts.utils.augmentations:_run"


[tool]

[tool.setuptools]
packages = ["pavessl"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-base.in"]}

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["BLE001", "UP032"]
