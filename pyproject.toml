[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "pavessl"
authors = [{name = "nelioasousa"}]
description = "Pre-training vision models using SSL"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["dependencies"]

[project.optional-dependencies]
cpu = ["torch", "torchvision"]
dev = ["ruff"]

[project.urls]
Source = "https://github.com/nelioasousa/PaveSSL"

[project.scripts]
ssl-pretrain = "pavessl.scripts.ssl_pretrain:run"
data-overview = "pavessl.scripts.rdd2022_overview:run"
prepare-data = "pavessl.scripts.rdd2022_prepare:run"


[tool]

[tool.setuptools]
packages = ["pavessl"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-base.in"]}

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["BLE001", "UP032"]
